name: Build Android Release APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ensure Android project scaffold exists
        run: flutter create --platforms=android .

      - name: Configure ML Kit optional language rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path('android/app')
          rules = app / 'proguard-rules.pro'
          rules.write_text(
              '-dontwarn com.google.mlkit.vision.text.chinese.**\n'
              '-dontwarn com.google.mlkit.vision.text.devanagari.**\n'
              '-dontwarn com.google.mlkit.vision.text.japanese.**\n'
              '-dontwarn com.google.mlkit.vision.text.korean.**\n'
          )
          gradle = app / 'build.gradle'
          kotlin = app / 'build.gradle.kts'
          target = gradle if gradle.exists() else kotlin
          source = target.read_text()
          if target.suffix == '.kts':
              line = 'isMinifyEnabled = false; isShrinkResources = false; proguardFiles += file("proguard-rules.pro")'
          else:
              line = "minifyEnabled false; shrinkResources false; proguardFiles 'proguard-rules.pro'"
          if line not in source:
              source, count = re.subn(r'release\s*\{', lambda m: m.group(0) + '\n            ' + line, source, count=1)
              if count != 1:
                  raise SystemExit('Could not configure release ProGuard rules')
              target.write_text(source)
          print('Configured optional ML Kit language warnings')
          PY

      - name: Set Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]
          for path in candidates:
              if path.exists():
                  source = path.read_text()
                  source = source.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
                  source = source.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
                  path.write_text(source)
                  print(f'Updated {path} to compileSdk 36')
                  break
          else:
              raise SystemExit('Android app Gradle file not found')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: life-rpg-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
